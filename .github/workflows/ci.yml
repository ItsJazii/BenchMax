name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCHMAX_REQUIRE_EVALUATOR_SMOKE: "1"
      BENCHMAX_APP_ORIGIN: "https://benchmax.test"
      NEXT_PUBLIC_APP_URL: "https://benchmax.test"
      NEXT_PUBLIC_USERCONTENT_ORIGIN: "https://evidence.benchmaxusercontent.test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: sandbox/browser-web-v1
      - run: npm run phase2:preflight
      - run: npx wrangler types --config wrangler.jsonc --env-interface=GeneratedEnv worker/generated-env.d.ts
      - run: npx playwright install --with-deps chromium ffmpeg
        working-directory: sandbox/browser-web-v1
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx wrangler deploy --dry-run --config dist/server/wrangler.json --name benchmax-staging --outdir .wrangler-dry-run/main
      - run: npx wrangler deploy --dry-run --config wrangler.usercontent.jsonc --env staging --outdir .wrangler-dry-run/usercontent
      - run: npm audit --omit=dev --audit-level=high
